apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentcore-dify-proxy
  namespace: agentcore
  labels:
    app: agentcore-dify-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentcore-dify-proxy
  template:
    metadata:
      labels:
        app: agentcore-dify-proxy
    spec:
      serviceAccountName: agentcore-proxy
      containers:
        - name: dify-proxy
          image: 964340114883.dkr.ecr.ap-southeast-1.amazonaws.com/agentcore-dify-proxy:v0.0.3
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: AWS_DEFAULT_REGION
              value: ap-southeast-1
            - name: DIFY_RUNTIME_READ_TIMEOUT_SECONDS
              value: "3900"
            - name: DIFY_RUNTIME_HEARTBEAT_SECONDS
              value: "20"
            - name: DIFY_ARTIFACT_CONNECT_TIMEOUT_SECONDS
              value: "3"
            - name: DIFY_ARTIFACT_READ_TIMEOUT_SECONDS
              value: "10"
            - name: DIFY_OFFICE_ARTIFACTS_BUCKET
              value: ah-dify
            - name: DIFY_OFFICE_ARTIFACTS_PREFIX
              value: harness_dev/
          resources:
            requests:
              cpu: 256m
              memory: 512Mi
            limits:
              cpu: 512m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
