apiVersion: apps/v1
kind: Deployment
metadata:
  name: timesfm-service
  namespace: agentcore
  labels:
    app: timesfm-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timesfm-service
  template:
    metadata:
      labels:
        app: timesfm-service
    spec:
      serviceAccountName: agentcore-proxy
      containers:
        - name: timesfm
          image: 964340114883.dkr.ecr.ap-southeast-1.amazonaws.com/timesfm-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 8Gi
          # Model loads ~30s on CPU — generous startup probe before health checks begin
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30   # allow up to 360s for model load
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
