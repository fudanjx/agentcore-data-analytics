---
# ClusterIP — for pods within the cluster
apiVersion: v1
kind: Service
metadata:
  name: timesfm-svc
  namespace: agentcore
spec:
  selector:
    app: timesfm-service
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP

---
# Internal NLB — for AgentCore Gateway (VPC-reachable from AWS managed infra)
apiVersion: v1
kind: Service
metadata:
  name: timesfm-svc-internal
  namespace: agentcore
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
spec:
  selector:
    app: timesfm-service
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
