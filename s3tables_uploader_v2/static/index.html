<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S3 Uploader v2</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><p class="eyebrow">S3 TABLES</p><h1>S3 Uploader v2</h1><p>Large files transfer directly to protected S3 storage. Processing runs separately in Fargate.</p></header>
<section id="login-panel"><h2>Sign in</h2><label>Password <input id="password" type="password" autocomplete="current-password"></label><button id="login">Sign in</button><p id="login-status" aria-live="polite"></p></section>
<section id="upload-panel" hidden><div class="section-title"><h2>Upload data</h2><button id="logout" class="secondary">Log out</button></div><label>Operation <select id="operation"><option value="append">Append to table</option><option value="create">Create table</option></select></label><label>S3 Tables bucket ARN <input id="bucket" placeholder="arn:aws:s3tables:ap-southeast-1:…:bucket/…"></label><label>Namespace <input id="namespace" pattern="[a-z][a-z0-9_]*" placeholder="e.g. ah"></label><label>Table <input id="table" pattern="[a-z][a-z0-9_]*" placeholder="e.g. encounters"></label><label>Parquet file <input id="file" type="file" accept=".parquet,.parquet.gzip"></label><p class="hint">Files are uploaded directly from this browser. No large file is sent through the API service.</p><button id="upload">Upload and start processing</button><p id="upload-status" aria-live="polite"></p></section>
<section id="job-panel" hidden><h2>Job status</h2><pre id="job-status"></pre></section></main><script src="/static/app.js"></script></body></html>
